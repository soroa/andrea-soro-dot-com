<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Apply — Matt Jameson</title>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;700;900&display=swap" rel="stylesheet">
<script>document.documentElement.className+=' js'</script>
<link rel="stylesheet" href="../site.css">
</head>
<body>

<div class="progress" aria-hidden="true"></div>

<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <symbol id="ig" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round">
    <rect x="2.5" y="2.5" width="19" height="19" rx="5.4"/>
    <circle cx="12" cy="12" r="4.4"/>
    <circle cx="17.6" cy="6.4" r="1.15" fill="currentColor" stroke="none"/>
  </symbol>
</svg>

<div class="wrap">
  <nav>
    <a class="logo" href="../">MATT JAMESON</a>
  </nav>
</div>

<div class="wrap">
  <section id="apply" class="apply">
    <div class="eyebrow reveal wipe"><span>Apply</span></div>
    <h2 class="reveal wipe"><span>Ready to get started?</span></h2>
    <p class="apply-lede reveal">Fill in the form below to apply for a Strategy Session Call. Matt reads every application himself and gets back to you directly.</p>
    <!-- Posts to the Vercel function in api/apply.js, which emails the
         application to Matt through Resend. Absolute path: the page lives at
         /matt/, so a relative one would resolve to /matt/api/apply. -->
    <form id="apply-form" class="form reveal" action="/api/apply" method="POST" novalidate>
      <div class="f2">
        <label>Name
          <input name="name" type="text" autocomplete="name" required></label>
        <label>Email address
          <input name="email" type="email" autocomplete="email" inputmode="email" required></label>
      </div>
      <div class="f2">
        <label>Phone number <small>· with country code</small>
          <input name="phone" type="tel" autocomplete="tel" inputmode="tel" placeholder="+44 7700 900123" pattern="^\+[0-9][0-9 ()\-]{6,20}$" required></label>
        <label>Which city do you live in?
          <input name="city" type="text" autocomplete="address-level2" required></label>
      </div>
      <label>What do you do for work?
        <input name="work" type="text" autocomplete="organization-title" required></label>
      <label>What are you currently struggling with most?
        <textarea name="struggle" rows="4" required></textarea></label>
      <label>Which type of coaching interests you the most?
        <select name="interest" required>
          <option value="" disabled selected>Choose one</option>
          <option>Bootcamp with Matt</option>
          <option>1-on-1 Live Coaching</option>
          <option>Online Coaching</option>
          <option>Not sure yet</option>
        </select></label>
      <input type="text" name="_gotcha" class="hp" tabindex="-1" autocomplete="off" aria-hidden="true">
      <button type="submit" class="pill">Send application</button>
      <p class="form-msg" role="status" aria-live="polite"></p>
    </form>
  </section>
</div>

<div class="wrap"><footer class="site">
  <span>© 2026 Matt Jameson</span>
  <span class="foot-links"><a href="https://www.instagram.com/advicefrommatt" target="_blank" rel="noopener noreferrer" aria-label="Matt Jameson on Instagram"><svg class="ico" aria-hidden="true"><use href="#ig"/></svg></a></span>
</footer></div>

<script src="../site.js"></script>
</body>
</html>
